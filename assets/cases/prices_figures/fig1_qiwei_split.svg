<svg xmlns="http://www.w3.org/2000/svg" width="680" height="224" viewBox="0 0 680 224" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Segoe UI',Helvetica,Arial,sans-serif" role="img">
<rect width="680" height="224" fill="#FFFFFF"/>
<text x="20" y="30" font-size="15" font-weight="600" fill="#1A1A1A">CPI 同比 +0.5% 的翘尾/新涨价拆分（教学构造）</text>
<text x="20" y="52" font-size="11.5" fill="#5B6472">+0.7 + (−0.2) = +0.5；新涨价为负 ⇒ 当期动能为负</text>
<line x1="268.3" y1="64" x2="268.3" y2="194" stroke="#1A1A1A" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="268.3" y="60" font-size="10.5" fill="#1A1A1A" text-anchor="middle">零</text>
<text x="16" y="87.7" font-size="12" fill="#1A1A1A">翘尾（滞后·上年余温）+0.7</text>
<rect x="268.3" y="70" width="228.8" height="26" fill="#D55E00" rx="2"/>
<text x="505.1" y="87.7" font-size="12" font-weight="600" fill="#D55E00" text-anchor="start">+0.70pp</text>
<text x="16" y="127.7" font-size="12" fill="#1A1A1A">新涨价（当期动能）−0.2</text>
<rect x="202.9" y="110" width="65.4" height="26" fill="#009E73" rx="2"/>
<text x="194.9" y="127.7" font-size="12" font-weight="600" fill="#009E73" text-anchor="end">-0.20pp</text>
<text x="16" y="167.7" font-size="12" fill="#1A1A1A">合计＝CPI同比 +0.5</text>
<rect x="268.3" y="150" width="163.4" height="26" fill="#D55E00" rx="2"/>
<text x="439.7" y="167.7" font-size="12" font-weight="600" fill="#D55E00" text-anchor="start">+0.50pp</text>
<text x="16" y="202" font-size="10.5" fill="#5B6472">红=偏离不利方向 · 绿=有利方向 · 虚线=零(+0.00pp)</text>
</svg>