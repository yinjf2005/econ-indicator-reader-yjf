<svg xmlns="http://www.w3.org/2000/svg" width="680" height="196" viewBox="0 0 680 196" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Segoe UI',Helvetica,Arial,sans-serif" role="img">
