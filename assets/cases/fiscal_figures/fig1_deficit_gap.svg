<svg xmlns="http://www.w3.org/2000/svg" width="680" height="224" viewBox="0 0 680 224" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Segoe UI',Helvetica,Arial,sans-serif" role="img">
<rect width="680" height="224" fill="#FFFFFF"/>
<text x="20" y="30" font-size="15" font-weight="600" fill="#1A1A1A">狭义 vs 实际赤字率：口径差 0.38pp（教学构造）</text>
<text x="20" y="52" font-size="11.5" fill="#5B6472">0.5 万亿 ÷ 130 万亿 = 0.38pp；评价财政力度应看实际赤字率</text>
<line x1="202.9" y1="64" x2="202.9" y2="194" stroke="#1A1A1A" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="202.9" y="60" font-size="10.5" fill="#1A1A1A" text-anchor="middle">零</text>
<text x="16" y="87.7" font-size="12" fill="#1A1A1A">狭义赤字率 3.00%</text>
<rect x="202.9" y="70" width="261.1" height="26" fill="#D55E00" rx="2"/>
<text x="472.0" y="87.7" font-size="12" font-weight="600" fill="#D55E00" text-anchor="start">+3.00%</text>
<text x="16" y="127.7" font-size="12" fill="#1A1A1A">调入 0.5万亿 → +0.38pp</text>
<rect x="202.9" y="110" width="33.1" height="26" fill="#D55E00" rx="2"/>
<text x="244.0" y="127.7" font-size="12" font-weight="600" fill="#D55E00" text-anchor="start">+0.38%</text>
<text x="16" y="167.7" font-size="12" fill="#1A1A1A">实际赤字率 3.38%</text>
<rect x="202.9" y="150" width="294.1" height="26" fill="#D55E00" rx="2"/>
<text x="505.1" y="167.7" font-size="12" font-weight="600" fill="#D55E00" text-anchor="start">+3.38%</text>
<text x="16" y="202" font-size="10.5" fill="#5B6472">红=偏离不利方向 · 绿=有利方向 · 虚线=零(+0.00%)</text>
</svg>